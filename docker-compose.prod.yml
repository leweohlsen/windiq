# Production compose — used by Coolify on the VPS.
#
# Unlike docker-compose.yml, no `build:` sections: images come pre-built
# from GHCR (see .github/workflows/deploy.yml). Pin `sha-<commit>` tags to roll back.
#
# pull_policy: always — Coolify runs plain `docker compose up -d`, whose default
# policy ("missing") would silently reuse the old `:latest` already cached on the
# host and deploy stale code.
name: windiq

services:
  # PostgreSQL 17 — named volume, no host port (access via `docker compose exec`)
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: windiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windiq}
      POSTGRES_DB: windiq
    volumes:
      - windiq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windiq -d windiq"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # FastAPI backend — internal only, reachable via nginx's /api reverse proxy
  backend:
    image: ghcr.io/leweohlsen/windiq-backend:latest
    pull_policy: always
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot migration — api, worker and scheduler wait for it
  migrate:
    image: ghcr.io/leweohlsen/windiq-backend:latest
    pull_policy: always
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Ingest worker — full backfill once at startup, then scheduled/on-demand tasks
  worker:
    image: ghcr.io/leweohlsen/windiq-backend:latest
    pull_policy: always
    command: taskiq worker app.worker:broker
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # taskiq controller — send-only, cron */5 → `periodic_sync`
  scheduler:
    image: ghcr.io/leweohlsen/windiq-backend:latest
    pull_policy: always
    command: taskiq scheduler app.worker:scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # React build served by nginx — the single entrypoint from the host
  frontend:
    image: ghcr.io/leweohlsen/windiq-frontend:latest
    pull_policy: always
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  windiq-pgdata:
