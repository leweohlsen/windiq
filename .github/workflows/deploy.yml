name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  push-images:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase image paths
      - name: Compute lowercase image names
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repo}-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # latest is what prod compose pulls; sha-<commit> pins for rollbacks
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:latest
            ${{ steps.names.outputs.frontend }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    needs: [push-images]
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Ping Coolify deploy webhook
        if: env.COOLIFY_WEBHOOK_URL != ''
        run: |
          args=(-X POST "$COOLIFY_WEBHOOK_URL")
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            args+=(-H "Authorization: Bearer $COOLIFY_API_TOKEN")
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "${args[@]}")
          echo "Coolify responds: $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Webhook not configured — deploy skipped
        if: env.COOLIFY_WEBHOOK_URL == ''
        run: |
          echo "::warning::COOLIFY_WEBHOOK_URL secret is not set — images were pushed to GHCR but Coolify was not told to redeploy."
          echo "Add a repo secret COOLIFY_WEBHOOK_URL pointing at your Coolify app's deploy webhook to finish the pipeline."
