[project]
name = "wind-iq-measurement-api-client"
version = "1.0.0"
description = "A client library for accessing WindIQ Measurement API"
authors = []
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wind_iq_measurement_api_client"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
