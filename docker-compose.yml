name: windiq

services:
  # PostgreSQL 17 — access: `docker compose exec db psql -U windiq`
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: windiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windiq}
      POSTGRES_DB: windiq
    ports:
      - "127.0.0.1:5432:5432"   # dev only: locally running backend + tests
    volumes:
      - windiq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windiq -d windiq"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # FastAPI backend — internal only, reachable via nginx's /api reverse proxy
  backend:
    build: ./backend
    image: windiq-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot migration — api, worker and scheduler wait for it, so the
  # migration never races the ingest worker's schema access.
  migrate:
    build: ./backend
    image: windiq-backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Ingest worker — runs a full backfill once at startup (idempotent), then
  # executes scheduled and on-demand tasks. SIGTERM: taskiq drains in-flight tasks.
  worker:
    build: ./backend
    image: windiq-backend
    command: taskiq worker app.worker:broker
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # taskiq controller — send-only; sends `periodic_sync` per cron. Postgres
  # doubles as the broker; taskiq-pg keeps its own taskiq_messages table there.
  scheduler:
    build: ./backend
    image: windiq-backend
    command: taskiq scheduler app.worker:scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://windiq:${POSTGRES_PASSWORD:-windiq}@db:5432/windiq
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # React build served by nginx — the single entrypoint from the host
  frontend:
    build:
      context: ./frontend
      target: runtime
    image: windiq-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  windiq-pgdata:
